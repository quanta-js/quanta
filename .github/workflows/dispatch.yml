name: Dispatch

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

# Shadow mode writes nothing, but the token still needs these for the day you
# promote to suggest or auto. Nothing here grants access to code or secrets.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: JeelGajera/Dispatch/apps/action@v0
        with:
          jev-key: ${{ secrets.TYPESAFE_API_KEY }}
