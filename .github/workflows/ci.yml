name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🔎 Type Check
        run: pnpm test:types

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🧪 Run tests with coverage
        run: pnpm test:coverage

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch must be available to compare against.
          fetch-depth: 0

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # Same-runner comparison against the PR's base branch; fails if a
      # scenario gets more than 30% slower. On push, reports only.
      - name: 📊 Compare benchmarks
        run: node benchmarks/compare.mjs ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}

  compat:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22
            node: 22
          - name: Node 24
            node: 24
          - name: React 18
            node: 20
            overrides: '{"react":"18.3.1","react-dom":"18.3.1","@types/react":"^18.3.0","@types/react-dom":"^18.3.0"}'
          # @quantajs/vue declares vue >=3.3 and falls back where 3.5 APIs are missing.
          - name: Vue 3.3
            node: 20
            overrides: '{"vue":"3.3.13"}'
          # @quantajs/svelte declares svelte >=4; its tests compile fixtures with
          # whichever Svelte is installed.
          - name: Svelte 4
            node: 20
            overrides: '{"svelte":"4.2.20"}'
          # @quantajs/lit declares lit >=2.
          - name: Lit 2
            node: 20
            overrides: '{"lit":"2.8.0"}'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      # Each binding declares a peer range wider than the version the main job
      # tests; these entries test its oldest supported version.
      - name: 📌 Pin ${{ matrix.name }}
        if: matrix.overrides
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.pnpm.overrides = { ...pkg.pnpm.overrides, ...JSON.parse(process.env.OVERRIDES) };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: 📦 Install dependencies
        run: pnpm install ${{ matrix.overrides && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: 🧪 Run tests
        run: pnpm test

  examples:
    name: Examples (in-repo verification)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # Astro 7 needs 22.12+
          cache: 'pnpm'

      # examples/* consume the packages via workspace:*, resolved through
      # each package's real `main`/`module`/`exports` fields — this installs
      # every example's dependencies (React, Vite, Next.js) too, which is why
      # this job is separate from lint/test rather than folded into them.
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      - name: 🏗️ Build examples
        run: pnpm examples:build

      - name: ✅ Verify examples
        run: pnpm examples:verify

  packaging:
    name: Packaging (published-artifact verification)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: 🌐 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        run: pnpm build

      # examples/* resolve @quantajs/* through the workspace, so every optional
      # peer is always present and every entry point resolves to source. That
      # makes them blind to packaging defects, and three have shipped: CJS
      # returning {} in 2.0.0, empty type declarations in 2.0.0, and the main
      # entry pulling in an uninstalled optional peer in 2.1.0. This job packs
      # the tarballs and installs them into a throwaway app the way a user
      # would.
      - name: 📦 Verify the published artifact
        run: pnpm verify:packaging

      - name: 📝 Type-check README examples
        run: pnpm verify:readme

      - name: 📏 Check bundle size budgets
        run: pnpm check:size
