version: 1

# Decide, log, write nothing. Read the decision log before changing this.
mode: shadow

# The model reads this. Write it for someone who has never seen the repository.
repoBrief: >-
  QuantaJS is a compact, framework-agnostic state management library for
  JavaScript and TypeScript. The monorepo holds three packages: core (the
  reactivity system, stores and actions), react (hooks and bindings), and
  devtools (inspection and time-travel debugging).

confidence:
  auto: 0.85 # apply at or above this
  suggest: 0.60 # propose at or above this; below it, say nothing

# Label dimensions become questions. These descriptions are the rubric.
labels:
  area:
    core: 'Reactivity system, stores, actions, computed values, subscriptions'
    react: 'React hooks and bindings, component re-render behaviour, SSR'
    devtools: 'Inspection, time-travel debugging, the devtools browser extension'

# Nothing destructive is opted in. Escalations are left off because this
# repository already runs stale.yml, and two bots arguing about staleness
# is worse than neither.
allowDestructive: []

rules:
  - id: needs-repro
    when: [issue.opened, issue.edited]
    if: "answers.type == 'bug' && answers.has_repro < 0.3"
    then:
      - { op: label, add: [needs-repro] }
      - { op: comment, template: needs-repro.md, key: needs-repro }

  - id: route-by-area
    when: [issue.opened, issue.edited]
    if: 'answers.label_area != null'
    then:
      - { op: label, add: ['area:{{answers.label_area}}'] }

  - id: welcome-newcomer
    when: [issue.opened]
    if: "item.authorAssociation == 'FIRST_TIME_CONTRIBUTOR'"
    then:
      - { op: comment, template: welcome.md, key: welcome }

data:
  sendBodies: true
  sendDiffs: true
  maxDiffBytes: 20000
  redact:
    - '(?<=Bearer )[A-Za-z0-9._-]+'
